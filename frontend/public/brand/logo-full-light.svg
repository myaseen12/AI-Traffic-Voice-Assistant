<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fullLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Shield Fill -->
    <linearGradient id="shieldFillLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>

    <!-- Highway Gradient -->
    <linearGradient id="highwayLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="280" rx="24" fill="url(#fullLightBg)" stroke="#E2E8F0" stroke-width="2" />

  <!-- SYMBOL GROUP -->
  <g transform="translate(48, 28) scale(0.44)">
    <!-- Outer Shield -->
    <path d="M 256 64 C 330 64 416 88 416 156 C 416 288 336 384 256 432 C 176 384 96 288 96 156 C 96 88 182 64 256 64 Z" 
          fill="url(#shieldFillLight)" 
          stroke="url(#shieldGradLight)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Highway Perspective -->
    <path d="M 196 400 L 236 248 L 276 248 L 316 400 C 296 414 276 424 256 432 C 236 424 216 414 196 400 Z" 
          fill="url(#highwayLight)" />
    
    <!-- Road Dashes -->
    <line x1="256" y1="384" x2="256" y2="340" stroke="#0284C7" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="316" x2="256" y2="284" stroke="#0284C7" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <line x1="256" y1="268" x2="256" y2="248" stroke="#0284C7" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Mic Capsule Core -->
    <rect x="226" y="132" width="60" height="104" rx="30" fill="#0F172A" stroke="#0284C7" stroke-width="8" />
    
    <!-- Cradle & Stand -->
    <path d="M 204 184 C 204 236 308 236 308 184" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="236" x2="256" y2="268" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <line x1="228" y1="268" x2="284" y2="268" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />

    <!-- Soundwave Pulse -->
    <path d="M 160 184 L 188 184 L 200 160 L 216 208 L 232 172 L 244 196 L 256 156 L 268 212 L 280 176 L 296 196 L 312 160 L 324 184 L 352 184" 
          fill="none" 
          stroke="#0284C7" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(300, 108)">
    <!-- Primary Brand Name -->
    <text x="0" y="0" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#0F172A" letter-spacing="-0.5">
      AI Traffic
    </text>
    
    <text x="250" y="0" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#0284C7" letter-spacing="-0.5">
      Voice Assistant
    </text>

    <!-- Subtitle / Category Label -->
    <text x="2" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="18" fill="#64748B" letter-spacing="3" text-transform="uppercase">
      Multilingual Civic Guidance System
    </text>

    <!-- Divider Line -->
    <line x1="2" y1="62" x2="520" y2="62" stroke="#E2E8F0" stroke-width="2" />
    <line x1="2" y1="62" x2="160" y2="62" stroke="#0284C7" stroke-width="2" />

    <!-- Tagline (Ask. Understand. Follow.) -->
    <text x="2" y="96" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="22" fill="#1D4ED8" letter-spacing="1">
      Ask. Understand. Follow.
    </text>
  </g>
</svg>
